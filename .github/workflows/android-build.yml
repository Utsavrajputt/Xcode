name: Android build

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & sign release APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Generate build metadata
        shell: bash
        run: |
          set -euo pipefail
          echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build unsigned release APK
        shell: bash
        run: ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Sign release APK
        shell: bash
        run: |
          set -euo pipefail
          build_tools_dir=$(ls -1 "$ANDROID_HOME/build-tools" | sort -V | tail -n1)
          apksigner="$ANDROID_HOME/build-tools/$build_tools_dir/apksigner"
          test -x "$apksigner"

          mkdir -p app/build/outputs/apk/signed

          unsigned=$(compgen -G "app/build/outputs/apk/release/*-unsigned.apk" | head -n1 || true)
          if [[ -z "$unsigned" ]]; then
            echo "Missing expected unsigned release APK"
            find app/build/outputs/apk -type f -name '*.apk' -print || true
            exit 1
          fi

          if [[ -z "${{ secrets.KEYSTORE_BASE64 }}" ]]; then
            echo "KEYSTORE_BASE64 is not set (expected for fork PRs); leaving it unsigned."
            cp "$unsigned" "app/build/outputs/apk/signed/xcode-unsigned.apk"
            exit 0
          fi

          if [[ -z "${{ secrets.KEY_ALIAS }}" || -z "${{ secrets.KEYSTORE_PASSWORD }}" || -z "${{ secrets.KEY_PASSWORD }}" ]]; then
            echo "KEYSTORE_BASE64 is set but KEY_ALIAS / KEYSTORE_PASSWORD / KEY_PASSWORD are missing."
            exit 1
          fi

          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release.jks

          "$apksigner" sign \
            --ks release.jks \
            --ks-key-alias "${{ secrets.KEY_ALIAS }}" \
            --ks-pass "pass:${{ secrets.KEYSTORE_PASSWORD }}" \
            --key-pass "pass:${{ secrets.KEY_PASSWORD }}" \
            --out "app/build/outputs/apk/signed/xcode.apk" \
            "$unsigned"
          rm -f release.jks

      - name: Verify APK signature
        shell: bash
        run: |
          set -euo pipefail
          build_tools_dir=$(ls -1 "$ANDROID_HOME/build-tools" | sort -V | tail -n1)
          apksigner="$ANDROID_HOME/build-tools/$build_tools_dir/apksigner"
          shopt -s nullglob
          signed=(app/build/outputs/apk/signed/*.apk)
          if [[ ${#signed[@]} -eq 0 ]]; then
            echo "No signed APKs found -- skipping verification (unsigned build)."
          else
            for apk in "${signed[@]}"; do
              [[ "$apk" == *-unsigned.apk ]] && continue
              "$apksigner" verify --verbose --print-certs "$apk"
            done
          fi

      - name: Upload Xcode APK
        uses: actions/upload-artifact@v4
        with:
          name: xcode-${{ env.SHORT_SHA }}
          path: app/build/outputs/apk/signed/*.apk
          if-no-files-found: error
          retention-days: 14
