name: Android CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: ktlint + Android lint
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: ktlint check
        run: ./gradlew ktlintCheck --stacktrace --no-daemon

      - name: Android lint (debug)
        run: ./gradlew lintDebug --stacktrace --no-daemon

      - name: Upload Android lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
          retention-days: 14

  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate build metadata
        shell: bash
        run: |
          set -euo pipefail
          echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      # app/build.gradle.kts reads KEYSTORE_FILE/KEYSTORE_PASSWORD/KEY_ALIAS/KEY_PASSWORD
      # from the environment and signs the debug build type with them when present.
      # The secrets context isn't valid in a step-level `if:`, so the presence
      # check happens inside this run: script instead (same pattern as xmd's
      # android-build.yml). On fork PRs the secrets aren't available, so the
      # build falls back to Gradle's default debug keystore.
      - name: Decode signing keystore
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${{ secrets.KEYSTORE_BASE64 }}" ]]; then
            echo "KEYSTORE_BASE64 is not set (expected for fork PRs); using the default debug keystore."
            exit 0
          fi

          if [[ -z "${{ secrets.KEY_ALIAS }}" || -z "${{ secrets.KEYSTORE_PASSWORD }}" || -z "${{ secrets.KEY_PASSWORD }}" ]]; then
            echo "KEYSTORE_BASE64 is set but KEY_ALIAS / KEYSTORE_PASSWORD / KEY_PASSWORD are missing."
            exit 1
          fi

          keystore_path="$RUNNER_TEMP/xcode-debug.jks"
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$keystore_path"
          {
            echo "KEYSTORE_FILE=$keystore_path"
            echo "KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}"
            echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}"
            echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}"
          } >> "$GITHUB_ENV"

      - name: Build debug APK
        shell: bash
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Remove decoded keystore
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/xcode-debug.jks"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: xcode-debug-${{ env.SHORT_SHA }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
