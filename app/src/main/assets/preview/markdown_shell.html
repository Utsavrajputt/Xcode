<!DOCTYPE html>
<!--
  M5 markdown preview shell.

  Loaded once per tab through WebViewAssetLoader (https://appassets.androidplatform.net/...),
  then driven entirely from Kotlin via evaluateJavascript: setDark(bool) on theme change and
  setContent(base64) on every debounced edit. Keeping the page itself static and pushing only
  these two calls is what makes the 300ms debounce cheap -- no page reload per keystroke.
-->
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<link id="hljs-theme" rel="stylesheet" href="libs/hljs-light.min.css">
<script src="libs/marked.min.js"></script>
<script src="libs/highlight.min.js"></script>
<style>
  :root {
    --bg: #F9F9FF;
    --fg: #191C20;
    --fg-variant: #44474E;
    --primary: #0B57D0;
    --outline: #C4C6D0;
    --code-bg: #EDEDF4;
    --quote-bg: #EDEDF4;
  }
  html.dark {
    --bg: #111318;
    --fg: #E2E2E9;
    --fg-variant: #C4C6D0;
    --primary: #A8C7FA;
    --outline: #44474E;
    --code-bg: #1D2024;
    --quote-bg: #1D2024;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 16px 18px 32px;
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, Roboto, "Segoe UI", sans-serif;
    font-size: 15px;
    line-height: 1.6;
    word-wrap: break-word;
  }
  h1, h2, h3, h4, h5, h6 { line-height: 1.3; margin: 1.2em 0 0.5em; }
  h1 { font-size: 1.7em; border-bottom: 1px solid var(--outline); padding-bottom: 0.3em; }
  h2 { font-size: 1.4em; border-bottom: 1px solid var(--outline); padding-bottom: 0.25em; }
  p, ul, ol, table, blockquote { margin: 0.6em 0; }
  a { color: var(--primary); }
  img { max-width: 100%; border-radius: 4px; }
  code {
    font-family: "JetBrains Mono", monospace;
    background: var(--code-bg);
    border-radius: 4px;
    padding: 0.15em 0.4em;
    font-size: 0.9em;
  }
  pre {
    background: var(--code-bg);
    border-radius: 8px;
    padding: 12px 14px;
    overflow-x: auto;
  }
  pre code { background: none; padding: 0; font-size: 0.85em; }
  blockquote {
    border-left: 3px solid var(--primary);
    background: var(--quote-bg);
    margin: 0.6em 0;
    padding: 0.4em 1em;
    color: var(--fg-variant);
  }
  table { border-collapse: collapse; width: 100%; }
  th, td { border: 1px solid var(--outline); padding: 6px 10px; text-align: left; }
  th { background: var(--code-bg); }
  hr { border: none; border-top: 1px solid var(--outline); margin: 1.2em 0; }
  #root:empty::before {
    content: attr(data-empty-text);
    color: var(--fg-variant);
    font-style: italic;
  }
</style>
</head>
<body>
<div id="root" data-empty-text="Nothing to preview yet"></div>
<script>
  marked.setOptions({
    gfm: true,
    breaks: false,
    highlight: undefined, // marked v18 uses the async walkTokens hook below instead
  });

  function highlightAll() {
    document.querySelectorAll('#root pre code').forEach(function (block) {
      try { hljs.highlightElement(block); } catch (e) { /* unknown language: leave plain */ }
    });
  }

  // Called from Kotlin. text arrives base64-encoded (UTF-8) so newlines/backticks/quotes in
  // the file never have to survive a naive string-escaped evaluateJavascript() call.
  function setContent(base64) {
    var bytes = atob(base64);
    var percentEncoded = Array.prototype.map.call(bytes, function (c) {
      return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
    }).join('');
    var text = decodeURIComponent(percentEncoded);
    var root = document.getElementById('root');
    try {
      root.innerHTML = marked.parse(text);
      highlightAll();
    } catch (e) {
      root.textContent = 'Preview error: ' + e.message;
    }
  }

  function setDark(isDark) {
    document.documentElement.classList.toggle('dark', !!isDark);
    document.getElementById('hljs-theme').href = isDark
      ? 'libs/hljs-dark.min.css'
      : 'libs/hljs-light.min.css';
  }
</script>
</body>
</html>
